services:
  - type: web
    name: gapino-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gapino-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

databases:
  - name: gapino-db
    databaseName: gapino
    user: gapino
